      - name: Build and boot laboratorio PHP completo
        run: docker compose -f compose.root.yml up -d --build

      - name: Wait for case01 health via hub
        shell: bash
        run: |
          for _ in {1..50}; do
            if curl -fsS "http://127.0.0.1:8100/01/health" > /dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -f compose.root.yml logs
          exit 1

      - name: Validate portal probe endpoint
        run: curl -fsS "http://127.0.0.1:8080/probe.php?case_id=01&stack=php"

      - name: Shutdown laboratorio PHP completo
        if: always()
        run: docker compose -f compose.root.yml down -v

  hub-probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: python-hub
            compose_file: compose.python.yml
            hub_port: 8200
            cases: "01 02 03 04 05 06 07 08 09 10 11 12 13 14 15 16 17"
          - name: node-hub
            compose_file: compose.nodejs.yml
            hub_port: 8300
            cases: "01 02 03 04 05 06 07 08 09 10 11 12 13 14 15 16 17"
          - name: java-hub
            compose_file: compose.java.yml
            hub_port: 8400
            cases: "01 02 03 04 05 06 07 08 09 10 11 12 13 14 15 16 17"
          - name: dotnet-hub
            compose_file: compose.dotnet.yml
            hub_port: 8500
            cases: "01 02 03 04 05 06 07 08 09 10 11 12 13 14 15 16 17"
          - name: go-hub
            compose_file: compose.go.yml
            hub_port: 8600
            cases: "01 02 03 04 05 06 07 08 09 10 11 12 13 14 15 16 17"
          - name: rust-hub
            compose_file: compose.rust.yml
            hub_port: 8700
            cases: "01 02 03 04 05 06 07 08 09 10 11 12 13 14 15 16 17"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Build and boot ${{ matrix.name }}
        run: docker compose -f ${{ matrix.compose_file }} up -d --build

      - name: Probe cases via ${{ matrix.name }}
        shell: bash
        run: |
          for attempt in {1..120}; do
            if curl -fsS "http://127.0.0.1:${{ matrix.hub_port }}/01/health" > /dev/null; then
              break
            fi
            sleep 2
            if [ "$attempt" = "120" ]; then
              docker compose -f "${{ matrix.compose_file }}" logs
              exit 1
            fi
          done
          for cid in ${{ matrix.cases }}; do
            if ! curl -fsS "http://127.0.0.1:${{ matrix.hub_port }}/${cid}/health" > /dev/null; then
              echo "case ${cid} failed health via ${{ matrix.name }}"
              docker compose -f "${{ matrix.compose_file }}" logs
              exit 1
            fi
          done

      - name: Shutdown ${{ matrix.name }}
        if: always()
        run: docker compose -f ${{ matrix.compose_file }} down -v
