name: CI

# GITHUB_TOKEN de solo lectura: este workflow no escribe nada en el repo.
permissions:
  contents: read

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  structure:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240  # v2
        with:
          php-version: "8.3"

      - name: Check generated catalog
        run: php scripts/generate_case_catalog.php --check

      - name: Validate repository structure
        run: bash scripts/validate-structure.sh

      # Coherencia de versiones de lenguaje: que todos los Dockerfile de un
      # stack fijen la misma imagen base y que el README declare esa version.
      # Es determinista y sin red — la deteccion de versiones nuevas publicadas
      # upstream vive en language-drift.yml, que corre por schedule.
      - name: Check language version coherence
        run: bash scripts/check-language-versions.sh

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065  # v5
        with:
          python-version: "3.12"

      # Los diagramas de docs/assets/ se derivan de shared/catalog/cases.json y
      # de los veredictos de cada comparison.md. Sin esta verificacion, agregar
      # un octavo stack dejaria los cinco SVG mostrando siete para siempre.
      - name: Check generated diagrams
        run: python scripts/generate_diagrams.py --check

  compose-config:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      # Con 99 entradas, cancelar el resto ante el primer fallo esconde los
      # demas: si un caso nuevo rompe varios compose a la vez, hay que verlos
      # todos en la misma corrida.
      fail-fast: false
      matrix:
        compose_file:
          - compose.root.yml
          - compose.portal.yml
          - compose.python.yml
          - compose.nodejs.yml
          - compose.java.yml
          - compose.dotnet.yml
          - compose.go.yml
          - compose.rust.yml
          - cases/01-api-latency-under-load/php/compose.yml
          - cases/02-n-plus-one-and-db-bottlenecks/php/compose.yml
          - cases/03-poor-observability-and-useless-logs/php/compose.yml
          - cases/04-timeout-chain-and-retry-storms/php/compose.yml
          - cases/05-memory-pressure-and-resource-leaks/php/compose.yml
          - cases/06-broken-pipeline-and-fragile-delivery/php/compose.yml
          - cases/07-incremental-monolith-modernization/php/compose.yml
          - cases/08-critical-module-extraction-without-breaking-operations/php/compose.yml
          - cases/09-unstable-external-integration/php/compose.yml
          - cases/10-expensive-architecture-for-simple-needs/php/compose.yml
          - cases/11-heavy-reporting-blocks-operations/php/compose.yml
